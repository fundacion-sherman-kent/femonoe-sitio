name: FEMÓNOE · buzón

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"   # cada cuatro horas: Telegram guarda lo pendiente sólo 24 h

permissions:
  contents: write

# Todo flujo que empuja a main comparte este grupo, para que nunca corran dos
# a la vez. No es prolijidad: tres flujos distintos escriben redes.json, y ese
# archivo NO lo regenera el robot —lleva las calificaciones de fuentes escritas
# a mano—. Con `git pull --rebase -X theirs`, el segundo en llegar no falla:
# pisa en silencio lo que escribió el primero, y nada se pone en rojo.
concurrency:
  group: femonoe-main
  cancel-in-progress: false

jobs:
  buzon:
    # **La máquina queda fijada, y no es «la última» por azar.**
    #
    # Autorizado por la dirección el 14/10/2026. GitHub está cambiando lo que
    # `ubuntu-latest` significa —de Ubuntu 24.04 a 26.04—, y textual de su
    # anuncio: «se desplegará a lo largo de varias semanas a partir del 19 de
    # octubre» y «la migración se completará el 19 de noviembre».
    #
    # El riesgo no es que el robot se rompa: las versiones del software que usa
    # son idénticas en las dos imágenes. El riesgo es que **durante un mes cada
    # corrida caiga en cualquiera de las dos**, de modo que una falla aparecería
    # un día y desaparecería al siguiente, sin causa visible. Para una casa que
    # publica juicios y promete que la misma entrada da la misma salida, eso es
    # peor que una rotura franca. GitHub avisa además que el 21 % de los
    # depósitos tiene al menos un trabajo que fallaría al arrancar en la nueva.
    #
    # Se vuelve a `ubuntu-latest` cuando la Oficina haya probado `ubuntu-26.04`
    # en un flujo aparte y con tiempo. **Hasta entonces esto no se toca.**
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Leer el buzón de Telegram
        run: python colectores/buzon.py
        continue-on-error: true
        env:
          BUZON_REMITENTES: ${{ secrets.BUZON_REMITENTES }}
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Leer el buzón de WhatsApp
        run: python colectores/buzon_whatsapp.py
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          WA_ROBOT_CLAVE: ${{ secrets.WA_ROBOT_CLAVE }}
      - name: Guardar
        run: |
          git config user.name "robot-femonoe"
          git config user.email "robot-femonoe@users.noreply.github.com"
          # `git add -A` sobre la raíz, y no una lista de rutas.
          #
          # **Por qué.** Este mismo defecto tumbó el motor de automejora el
          # 28/9 y la corrida diaria del 3 al 5/10, tres días seguidos: un
          # programa escribe un archivo que no está en la lista del `git add`
          # —acá fue `calendario.json`, que escriben `elecciones.py` y
          # `confirmar.py`—, el árbol queda sucio y `git pull --rebase` se
          # niega. Lo peor es que la recolección **sí había funcionado**: el
          # commit local decía «18 archivos, 9.036 líneas». Se recolectaba y se
          # tiraba, todos los días, sin que nadie se enterara.
          #
          # El 2/10 se arregló en el motor y **no se buscó en los demás
          # flujos**. Por eso ahora se arregla el patrón en todos a la vez: una
          # lista de rutas envejece cada vez que un colector escribe algo nuevo,
          # y `.gitignore` ya cuida lo que no debe versionarse.
          git add -A
          git commit -m "Buzón $(date +%F\ %H:%M)" || echo "Sin novedades"
          git pull --rebase -X theirs
          git push
