name: FEMÓNOE · desplegar el vigía de organismos

# Se corre a mano. Publica en Cloudflare el vigía que mira las autoridades
# electorales cada dos minutos, crea su espacio de almacenamiento si no existe
# y le carga su clave. Deja escrita su dirección en vigia/url.txt.
#
# POR QUÉ A MANO Y NO SOLO. Despliega algo en la cuenta de Cloudflare de la
# Fundación y ocupa uno de los cinco disparadores horarios del plan gratuito.
# Eso lo autoriza la dirección, no el robot.
#
# POR QUÉ REUSA LA CLAVE DEL BUZÓN. El vigía necesita una clave para que el
# robot retire sus novedades. Se reusa WA_ROBOT_CLAVE —misma cuenta, mismo
# robot, mismo nivel de confianza— para no pedirle a la dirección que pegue un
# secreto más. Si algún día conviene separarlas, se separan sin tocar el código:
# basta cargar una clave propia y cambiar el paso de abajo.

on:
  workflow_dispatch:

permissions:
  contents: write

# El mismo portón que los demás: nunca dos flujos empujando a main a la vez.
concurrency:
  group: femonoe-main
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vigia
        shell: bash -eo pipefail {0}   # si un paso falla, la corrida queda en rojo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      # El padrón se regenera siempre desde autoridades.json, que es su fuente
      # única. Así el vigía no puede llevar una copia desincronizada.
      - name: Regenerar el padrón desde autoridades.json
        run: |
          python padron.py
          git diff --quiet padron.js || echo "El padrón cambió y se despliega con el padrón nuevo."

      - name: Espacio de almacenamiento
        run: |
          ID=$(npx --yes wrangler@3 kv namespace list | python3 -c "import sys,json;print(next((n['id'] for n in json.load(sys.stdin) if n['title'].endswith('VIGIA')),''))")
          if [ -z "$ID" ]; then
            ID=$(npx --yes wrangler@3 kv namespace create VIGIA | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          test -n "$ID" || { echo "No se pudo obtener el espacio de almacenamiento"; exit 1; }
          sed -i "s/COMPLETAR_AL_CREAR/$ID/" wrangler.toml
          echo "Espacio: $ID"

      - name: Publicar el vigía
        run: npx --yes wrangler@3 deploy | tee despliegue.txt

      - name: Cargar la clave del vigía
        run: printf '%s' "${{ secrets.WA_ROBOT_CLAVE }}" | npx --yes wrangler@3 secret put ROBOT_CLAVE

      # Se comprueba que el disparador horario quedó puesto. Un vigía desplegado
      # sin cron no vigila nada, y el despliegue saldría en verde igual.
      - name: Comprobar que el disparador quedó puesto
        run: |
          curl -sf "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/femonoe-vigia/schedules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > crons.json
          python3 -c "
          import json
          d = json.load(open('crons.json'))
          s = (d.get('result') or {}).get('schedules') or d.get('result') or []
          if not s:
              raise SystemExit('El vigía quedó desplegado SIN disparador horario: no vigilaría nada.')
          print('Disparador puesto:', ', '.join(str(x.get('cron')) for x in s))
          "

      - name: Anotar la dirección del vigía
        run: |
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' despliegue.txt | head -1 > url.txt
          test -s url.txt || { echo "No se obtuvo la dirección del vigía"; exit 1; }
          echo "Vigía en: $(cat url.txt)"
          git checkout wrangler.toml
          rm -f despliegue.txt crons.json
          git config user.name "robot-femonoe"
          git config user.email "robot-femonoe@users.noreply.github.com"
          git add url.txt padron.js
          git commit -m "Dirección del vigía de organismos" || echo "Sin cambios"
          git pull --rebase
          git push
