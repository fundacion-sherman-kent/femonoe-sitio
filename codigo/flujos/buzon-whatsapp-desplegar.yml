name: FEMÓNOE · desplegar el receptor del buzón de WhatsApp

# Se corre a mano, una vez, cuando la dirección cargó los secretos. Crea el espacio
# de almacenamiento si no existe, publica el receptor en Cloudflare y le carga sus
# tres secretos. Deja escrita la dirección del receptor en whatsapp-buzon/url.txt,
# que es la que se pega en Meta. Nadie escribe claves a mano en el código.

on:
  workflow_dispatch:
    inputs:
      subdominio:
        description: "Subdominio workers.dev de la cuenta (sólo la primera vez; lo decide la dirección)"
        type: string
        default: ""

permissions:
  contents: write

# Todo flujo que empuja a main comparte este grupo, para que nunca corran dos
# a la vez. No es prolijidad: tres flujos distintos escriben redes.json, y ese
# archivo NO lo regenera el robot —lleva las calificaciones de fuentes escritas
# a mano—. Con `git pull --rebase -X theirs`, el segundo en llegar no falla:
# pisa en silencio lo que escribió el primero, y nada se pone en rojo.
concurrency:
  group: femonoe-main
  cancel-in-progress: false

jobs:
  desplegar:
    # **La máquina queda fijada, y no es «la última» por azar.**
    #
    # Autorizado por la dirección el 14/10/2026. GitHub está cambiando lo que
    # `ubuntu-latest` significa —de Ubuntu 24.04 a 26.04—, y textual de su
    # anuncio: «se desplegará a lo largo de varias semanas a partir del 19 de
    # octubre» y «la migración se completará el 19 de noviembre».
    #
    # El riesgo no es que el robot se rompa: las versiones del software que usa
    # son idénticas en las dos imágenes. El riesgo es que **durante un mes cada
    # corrida caiga en cualquiera de las dos**, de modo que una falla aparecería
    # un día y desaparecería al siguiente, sin causa visible. Para una casa que
    # publica juicios y promete que la misma entrada da la misma salida, eso es
    # peor que una rotura franca. GitHub avisa además que el 21 % de los
    # depósitos tiene al menos un trabajo que fallaría al arrancar en la nueva.
    #
    # Se vuelve a `ubuntu-latest` cuando la Oficina haya probado `ubuntu-26.04`
    # en un flujo aparte y con tiempo. **Hasta entonces esto no se toca.**
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: whatsapp-buzon
        shell: bash -eo pipefail {0}   # si un paso falla, la corrida queda en rojo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Espacio de almacenamiento
        run: |
          ID=$(npx --yes wrangler@3 kv namespace list | python3 -c "import sys,json;print(next((n['id'] for n in json.load(sys.stdin) if n['title'].endswith('BUZON')),''))")
          if [ -z "$ID" ]; then
            ID=$(npx --yes wrangler@3 kv namespace create BUZON | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          sed -i "s/COMPLETAR_AL_CREAR/$ID/" wrangler.toml
          echo "Espacio: $ID"
      - name: Subdominio workers.dev (una sola vez)
        if: inputs.subdominio != ''
        run: |
          curl -sf -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"             --data '{"subdomain":"${{ inputs.subdominio }}"}' | python3 -c "import sys,json;d=json.load(sys.stdin);print('Subdominio:',d['result']['subdomain'])"
      - name: Publicar el receptor
        run: npx --yes wrangler@3 deploy | tee despliegue.txt
      - name: Cargar los secretos del receptor
        run: |
          printf '%s' "${{ secrets.WA_VERIFY_TOKEN }}" | npx --yes wrangler@3 secret put VERIFY_TOKEN
          printf '%s' "${{ secrets.WA_APP_SECRET }}"   | npx --yes wrangler@3 secret put APP_SECRET
          printf '%s' "${{ secrets.WA_ROBOT_CLAVE }}"  | npx --yes wrangler@3 secret put ROBOT_CLAVE
      - name: Anotar la dirección del receptor
        run: |
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' despliegue.txt | head -1 > url.txt
          test -s url.txt || { echo "No se obtuvo la dirección del receptor"; exit 1; }
          echo "Dirección para pegar en Meta: $(cat url.txt)/webhook"
          git checkout wrangler.toml
          git config user.name "robot-femonoe"
          git config user.email "robot-femonoe@users.noreply.github.com"
          git add url.txt
          git commit -m "Dirección del receptor del buzón de WhatsApp" || echo "Sin cambios"
          git pull --rebase -X theirs
          git push
